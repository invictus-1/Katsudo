[package]
name = "katsudo-setup"
version = "0.1.0"
description = "Katsudō installer and uninstaller"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
miniz_oxide = "0.8"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_Security",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
